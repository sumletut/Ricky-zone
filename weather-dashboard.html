<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard - Prakiraan Cuaca Modern</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-light: #334155;
      --accent: #38bdf8;
      --accent-warm: #f59e0b;
      --accent-rain: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --muted: #94a3b8;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --radius: 16px;
      --max-width: 1200px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg) 0%, #1a2332 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-warm));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Search Section */
    .search-section {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background-color: var(--panel);
      border: 2px solid var(--panel-light);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    .btn {
      padding: 12px 24px;
      background-color: var(--accent);
      color: #0b1220;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .btn:hover {
      background-color: #06b6d4;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(56, 189, 248, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-location {
      padding: 12px 16px;
      background-color: var(--accent-warm);
      color: #0b1220;
    }

    .btn-location:hover {
      background-color: #d97706;
    }

    /* Loading & Error */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--panel-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 2px solid var(--danger);
      border-radius: var(--radius);
      padding: 16px;
      color: #fca5a5;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .error-icon {
      font-size: 1.5rem;
    }

    /* Main Weather Display */
    .weather-main {
      background-color: var(--panel);
      border-radius: var(--radius);
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      border: 1px solid var(--panel-light);
    }

    .weather-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }

    .location-info h2 {
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .location-time {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .weather-icon {
      font-size: 4rem;
      line-height: 1;
    }

    .weather-current {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .weather-stat {
      background-color: rgba(56, 189, 248, 0.1);
      border-left: 4px solid var(--accent);
      padding: 16px;
      border-radius: 8px;
    }

    .weather-stat.rain {
      border-left-color: var(--accent-rain);
      background-color: rgba(59, 130, 246, 0.1);
    }

    .weather-stat.wind {
      border-left-color: var(--accent-warm);
      background-color: rgba(245, 158, 11, 0.1);
    }

    .weather-stat.pressure {
      border-left-color: var(--success);
      background-color: rgba(16, 185, 129, 0.1);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    /* Forecast Section */
    .forecast-section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: var(--text);
      font-weight: 600;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .forecast-card {
      background-color: var(--panel);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--panel-light);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .forecast-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
    }

    .forecast-time {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .forecast-icon {
      font-size: 2.5rem;
      margin: 12px 0;
    }

    .forecast-temp {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .forecast-description {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .forecast-details {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Details Grid */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .detail-card {
      background-color: var(--panel);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--panel-light);
    }

    .detail-card h3 {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-card .value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 16px;
      background-color: var(--panel-light);
      color: var(--text-secondary);
      border: 1px solid var(--panel-light);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #0b1220;
      border-color: var(--accent);
    }

    .tab-btn:hover {
      border-color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      .weather-main {
        padding: 20px;
      }

      .weather-header {
        flex-direction: column;
      }

      .weather-icon {
        font-size: 3rem;
      }

      .weather-current {
        grid-template-columns: repeat(2, 1fr);
      }

      .forecast-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }

      .search-box {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .weather-current {
        grid-template-columns: 1fr;
      }

      .forecast-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⛅ Weather Dashboard</h1>
      <p class="subtitle">Prakiraan cuaca real-time untuk lokasi Anda</p>
    </header>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari kota (contoh: Jakarta, London, Tokyo...)" 
          aria-label="Cari kota untuk prakiraan cuaca"
        >
        <button class="btn" onclick="searchWeather()">Cari</button>
        <button class="btn btn-location" onclick="getLocationWeather()" title="Gunakan lokasi saat ini">📍</button>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="error" style="display: none;">
      <span class="error-icon">⚠️</span>
      <span id="errorText"></span>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p style="margin-top: 16px;">Memuat data cuaca...</p>
    </div>

    <!-- Main Weather Display -->
    <div id="weatherContent" style="display: none;">
      <!-- Current Weather -->
      <div class="weather-main">
        <div class="weather-header">
          <div class="location-info">
            <h2 id="cityName">-</h2>
            <div class="location-time" id="updateTime">-</div>
          </div>
          <div class="weather-icon" id="weatherIcon">🌤️</div>
        </div>

        <div id="weatherDescription" style="color: var(--muted); font-size: 1.1rem; margin-bottom: 20px;">-</div>

        <div class="weather-current">
          <div class="weather-stat">
            <div class="stat-label">Suhu</div>
            <div class="stat-value"><span id="temp">-</span>°C</div>
          </div>
          <div class="weather-stat">
            <div class="stat-label">Terasa Seperti</div>
            <div class="stat-value"><span id="feelsLike">-</span>°C</div>
          </div>
          <div class="weather-stat rain">
            <div class="stat-label">Kelembaban</div>
            <div class="stat-value"><span id="humidity">-</span>%</div>
          </div>
          <div class="weather-stat wind">
            <div class="stat-label">Kecepatan Angin</div>
            <div class="stat-value"><span id="windSpeed">-</span> m/s</div>
          </div>
          <div class="weather-stat pressure">
            <div class="stat-label">Tekanan</div>
            <div class="stat-value"><span id="pressure">-</span> hPa</div>
          </div>
          <div class="weather-stat">
            <div class="stat-label">Visibilitas</div>
            <div class="stat-value"><span id="visibility">-</span> km</div>
          </div>
        </div>
      </div>

      <!-- Forecast Section -->
      <div class="forecast-section">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchForecast('3h')">3 Jam</button>
          <button class="tab-btn" onclick="switchForecast('24h')">24 Jam</button>
          <button class="tab-btn" onclick="switchForecast('5d')">5 Hari</button>
        </div>

        <h3 class="section-title">Prakiraan Cuaca</h3>
        <div class="forecast-grid" id="forecastGrid">
          <!-- Populated by JavaScript -->
        </div>
      </div>

      <!-- Additional Details -->
      <div class="forecast-section">
        <h3 class="section-title">Detail Lanjutan</h3>
        <div class="details-grid">
          <div class="detail-card">
            <h3>Arah Angin</h3>
            <div class="value" id="windDirection">-</div>
          </div>
          <div class="detail-card">
            <h3>Kemungkinan Hujan</h3>
            <div class="value" id="rainChance">-</div>
          </div>
          <div class="detail-card">
            <h3>Tingkat UV</h3>
            <div class="value" id="uvIndex">-</div>
          </div>
          <div class="detail-card">
            <h3>Cloudiness</h3>
            <div class="value" id="cloudiness">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // API Configuration
    const API_KEY = 'e62e10c16b9a6e1db57ad1df10e0a497'; // Demo key - ganti dengan milik Anda
    const WEATHER_API = 'https://api.openweathermap.org/data/2.5';
    const GEO_API = 'https://api.openweathermap.org/geo/1.0';

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const weatherContent = document.getElementById('weatherContent');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');

    let forecastMode = '3h'; // Current forecast mode
    let currentWeatherData = null;
    let forecastData = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchWeather();
      });
      // Load default city
      loadWeather('Jakarta');
    });

    // Show Error
    function showError(message) {
      errorText.textContent = message;
      errorMsg.style.display = 'flex';
      weatherContent.style.display = 'none';
      loading.style.display = 'none';
    }

    // Hide Error
    function hideError() {
      errorMsg.style.display = 'none';
    }

    // Search Weather
    function searchWeather() {
      const city = searchInput.value.trim();
      if (city) {
        loadWeather(city);
      }
    }

    // Get Location Weather
    function getLocationWeather() {
      if (navigator.geolocation) {
        loading.style.display = 'block';
        hideError();
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            loadWeatherByCoords(latitude, longitude);
          },
          () => showError('Tidak dapat mengakses lokasi Anda. Pastikan izin lokasi sudah diaktifkan.')
        );
      } else {
        showError('Geolocation tidak didukung oleh browser Anda.');
      }
    }

    // Load Weather by City Name
    async function loadWeather(city) {
      loading.style.display = 'block';
      hideError();
      try {
        // Get coordinates from city name
        const geoResponse = await fetch(
          `${GEO_API}/direct?q=${encodeURIComponent(city)}&limit=1&appid=${API_KEY}`
        );
        const geoData = await geoResponse.json();

        if (geoData.length === 0) {
          showError(`Kota "${city}" tidak ditemukan. Silahkan coba kota lain.`);
          return;
        }

        const { lat, lon, name, country } = geoData[0];
        loadWeatherByCoords(lat, lon, `${name}, ${country}`);
      } catch (error) {
        showError('Gagal memuat data cuaca. Periksa koneksi internet Anda.');
        console.error(error);
      }
    }

    // Load Weather by Coordinates
    async function loadWeatherByCoords(lat, lon, displayName = null) {
      try {
        // Current weather
        const weatherResponse = await fetch(
          `${WEATHER_API}/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`
        );
        const weatherData = await weatherResponse.json();

        // Forecast
        const forecastResponse = await fetch(
          `${WEATHER_API}/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`
        );
        const forecastDataRaw = await forecastResponse.json();

        currentWeatherData = weatherData;
        forecastData = forecastDataRaw;

        displayWeather(weatherData, displayName);
        displayForecast(forecastDataRaw.list);

        searchInput.value = '';
        loading.style.display = 'none';
        weatherContent.style.display = 'block';
      } catch (error) {
        showError('Gagal memuat data cuaca. Silahkan coba lagi.');
        console.error(error);
      }
    }

    // Display Current Weather
    function displayWeather(data, displayName = null) {
      const { main, weather, wind, clouds, visibility, sys } = data;
      
      // City name
      const cityDisplay = displayName || `${data.name}, ${data.sys.country}`;
      document.getElementById('cityName').textContent = cityDisplay;

      // Update time
      const now = new Date();
      document.getElementById('updateTime').textContent = 
        `Diperbarui: ${now.toLocaleString('id-ID')}`;

      // Weather description
      const desc = weather[0].description.charAt(0).toUpperCase() + weather[0].description.slice(1);
      document.getElementById('weatherDescription').textContent = desc;

      // Weather icon
      const iconMap = {
        '01d': '☀️', '01n': '🌙',
        '02d': '🌤️', '02n': '🌤️',
        '03d': '☁️', '03n': '☁️',
        '04d': '☁️', '04n': '☁️',
        '09d': '🌧️', '09n': '🌧️',
        '10d': '🌦️', '10n': '🌧️',
        '11d': '⛈️', '11n': '⛈️',
        '13d': '❄️', '13n': '❄️',
        '50d': '🌫️', '50n': '🌫️'
      };
      const icon = iconMap[weather[0].icon] || '🌤️';
      document.getElementById('weatherIcon').textContent = icon;

      // Temperature
      document.getElementById('temp').textContent = Math.round(main.temp);
      document.getElementById('feelsLike').textContent = Math.round(main.feels_like);

      // Other stats
      document.getElementById('humidity').textContent = main.humidity;
      document.getElementById('pressure').textContent = main.pressure;
      document.getElementById('windSpeed').textContent = wind.speed.toFixed(1);
      document.getElementById('visibility').textContent = (visibility / 1000).toFixed(1);

      // Wind direction
      const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 
                         'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      const index = Math.round(wind.deg / 22.5) % 16;
      const windDir = directions[index] + ' (' + wind.deg + '°)';
      document.getElementById('windDirection').textContent = windDir;

      // Rain chance & UV (from forecast or default)
      const rainChance = data.clouds?.all || 0;
      document.getElementById('rainChance').textContent = rainChance + '%';
      document.getElementById('uvIndex').textContent = '5 (Sedang)'; // Default
      document.getElementById('cloudiness').textContent = clouds.all + '%';
    }

    // Display Forecast
    function displayForecast(forecastList) {
      displayForecastByMode('3h', forecastList);
    }

    // Switch Forecast Mode
    function switchForecast(mode) {
      forecastMode = mode;
      
      // Update active tab
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      displayForecastByMode(mode, forecastData.list);
    }

    // Display Forecast by Mode
    function displayForecastByMode(mode, forecastList) {
      const forecastGrid = document.getElementById('forecastGrid');
      forecastGrid.innerHTML = '';

      let filtered = [];
      const now = new Date();

      if (mode === '3h') {
        // Next 3 hours (every entry)
        filtered = forecastList.slice(0, 8);
      } else if (mode === '24h') {
        // Next 24 hours (every 3-hour interval)
        filtered = forecastList.slice(0, 8);
      } else if (mode === '5d') {
        // 5 days (one per day at same time)
        filtered = forecastList.filter((item, index) => index % 8 === 0).slice(0, 5);
      }

      filtered.forEach(item => {
        const date = new Date(item.dt * 1000);
        const temp = Math.round(item.main.temp);
        const description = item.weather[0].main;
        const icon = getWeatherIcon(item.weather[0].icon);

        const card = document.createElement('div');
        card.className = 'forecast-card';
        card.innerHTML = `
          <div class="forecast-time">${formatTime(date, mode)}</div>
          <div class="forecast-icon">${icon}</div>
          <div class="forecast-temp">${temp}°C</div>
          <div class="forecast-description">${description}</div>
          <div class="forecast-details">
            <span>💧${item.main.humidity}%</span>
            <span>💨${item.wind.speed.toFixed(1)}m/s</span>
          </div>
        `;
        forecastGrid.appendChild(card);
      });
    }

    // Format Time
    function formatTime(date, mode) {
      if (mode === '5d') {
        return date.toLocaleDateString('id-ID', { weekday: 'short', month: 'short', day: 'numeric' });
      }
      return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    // Get Weather Icon
    function getWeatherIcon(iconCode) {
      const iconMap = {
        '01d': '☀️', '01n': '🌙',
        '02d': '🌤️', '02n': '🌤️',
        '03d': '☁️', '03n': '☁️',
        '04d': '☁️', '04n': '☁️',
        '09d': '🌧️', '09n': '🌧️',
        '10d': '🌦️', '10n': '🌧️',
        '11d': '⛈️', '11n': '⛈️',
        '13d': '❄️', '13n': '❄️',
        '50d': '🌫️', '50n': '🌫️'
      };
      return iconMap[iconCode] || '🌤️';
    }
  </script>

</body>
</html>
